# ==============================================================================
# ABSOLUTE BATTERY EFFICIENCY PROFILE (Acer Aspire Lite 15 / i5-13420H)
# ==============================================================================

# Operation mode force
TLP_ENABLE=1
TLP_DEFAULT_MODE=BAT
TLP_PERSISTENT_DEFAULT=1

# --- CPU Scaling & Energy Performance Hints (intel_pstate) ---
# Limits max frequency on battery and forces power-save EPP hints
CPU_DRIVER_OPMODE_ON_AC=active
CPU_DRIVER_OPMODE_ON_BAT=active

CPU_SCALING_GOVERNOR_ON_AC=powersave
CPU_SCALING_GOVERNOR_ON_BAT=powersave

# Set Energy Performance Preference (EPP) to maximum energy saving on battery
CPU_ENERGY_PERF_POLICY_ON_AC=balance_performance
CPU_ENERGY_PERF_POLICY_ON_BAT=power

# Cap maximum CPU performance percentage on battery (disables aggressive boost clocks)
CPU_SCALING_MIN_FREQ_ON_BAT=400000
CPU_SCALING_MAX_FREQ_ON_BAT=1800000

# Disable Intel Turbo Boost on battery to prevent power spikes during simple web/text tasks
CPU_BOOST_ON_AC=1
CPU_BOOST_ON_BAT=0

# Disable Hyper-Threading / SMT when on battery (Forces single-thread execution per core)
CPU_HWP_DYN_BOOST_ON_AC=1
CPU_HWP_DYN_BOOST_ON_BAT=0

# --- Intel iGPU Power Savings ---
# Min/Max GPU frequencies in MHz for Intel UHD / Xe Graphics
INTEL_GPU_MIN_FREQ_ON_AC=300
INTEL_GPU_MIN_FREQ_ON_BAT=300
INTEL_GPU_MAX_FREQ_ON_AC=1400
INTEL_GPU_MAX_FREQ_ON_BAT=600
INTEL_GPU_BOOST_FREQ_ON_BAT=600

# --- PCIe Active State Power Management & Runtime PM ---
# Enable aggressive ASPM and runtime suspension for PCI devices
PCIE_ASPM_ON_AC=default
PCIE_ASPM_ON_BAT=powersave

RUNTIME_PM_ON_AC=on
RUNTIME_PM_ON_BAT=auto

# --- Storage & NVMe Power Management ---
# Set APM level and NVMe power states
DISK_APM_LEVEL_ON_AC="254 254"
DISK_APM_LEVEL_ON_BAT="1 1"

AHCI_RUNTIME_PM_ON_BAT=auto
NVME_PME_ON_BAT=auto

# --- USB Autosuspend ---
# Autosuspend USB devices after 2 seconds of inactivity
USB_AUTOSUSPEND=1
USB_AUTOSUSPEND_DISABLE_ON_SHUTDOWN=1

# --- Network & Connectivity ---
# Force Wi-Fi power saving mode on battery
WIFI_PWR_ON_AC=off
WIFI_PWR_ON_BAT=on

# Disable Wake-on-LAN
WOL_DISABLE=Y

# --- Platform & Audio Power Savings ---
# Enable Intel HDA / AC97 audio chip power down after 1 second
SOUND_POWER_SAVE_ON_AC=10
SOUND_POWER_SAVE_ON_BAT=1
SOUND_POWER_SAVE_CONTROLLER=Y
