# ==============================================================================
# MPV ULTRA-LOW POWER PROFILE (360p / Intel i5-13420H / Debian Trixie XFCE)
# ==============================================================================

# --- Video Output & Hardware Acceleration ---
# Direct hardware rendering surface with minimal compositor overhead
vo=gpu
gpu-context=x11egl

# Force hardware decoding via VA-API (Intel QuickSync ASIC)
hwdec=vaapi

# --- Render Quality & Scaling ---
# Fast, low-overhead bilinear scaler (ideal for ultra-low CPU/iGPU power)
scale=bilinear
cscale=bilinear
dscale=bilinear

# Disable heavy post-processing and shaders
dither=no
deband=no

# --- Stream Quality & Format Selection (360p Focus) ---
# Instruct yt-dlp to grab 480p (fallback <= 480p), preferring H.264/VP9
ytdl-format="bestvideo[height<=?480][vcodec^=avc1]+bestaudio/bestvideo[height<=?480]+bestaudio/best[height<=?480]/best"

# Force yt-dlp executable path explicitly
script-opts=ytdl_hook-ytdl_path=yt-dlp

# --- RAM Caching (Minimizes Disk I/O & NVMe Sleep Breaks) ---
cache=yes
# Keep up to 100MB of streamed content preloaded in RAM
demuxer-max-bytes=100M
# Retain up to 50MB of previously watched video in RAM for backward seeking
demuxer-max-back-bytes=50M

# --- Window & OSD Settings ---
# Minimal interface overhead
keep-open=yes
#autofit=854x480
